[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dualtrace"
version = "0.1.0"
description = "DualTrace: complementary evidence for AI-generated image and text detection"
license = "MIT"
requires-python = ">=3.11"
readme = "README.md"
dependencies = []

[project.scripts]
dualtrace = "dualtrace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dualtrace*"]
